# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: yashikota
    repo_name: gnu-assets
    description: Static binary release pipelines for GNU software, published as GitHub Releases for use with package managers
